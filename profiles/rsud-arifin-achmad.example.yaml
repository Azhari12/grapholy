    keywords: ["approval", "signer", "unlock", "tte"]
  - group: "Modul Radiologi"
    keywords: ["radiologi", "myvue", "viewer"]
  - group: "Booking BPJS Antrol"
    keywords: ["booking", "antrol", "check-in", "antrean"]

