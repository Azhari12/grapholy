# Profile contoh — Grapholy
# Salin ke config/repos.local.yaml & config/penanda.local.json, lalu custom.
# Aplikasi generic; profile ini hanya contoh (tidak wajib dipakai).

profile:
  name: "RSUD Arifin Achmad — Tim Pengembangan Sistem"
  description: "Contoh profile untuk laporan bulanan pengembangan SIMDOK/MIRAI"

repos:
  - owner: EDP-RSUD-Arifin-Achmad
    name: simdok-fe
    label: "SIMDOK (Front-End)"
    category: "SIMDOK"
    project_key: "SIMDOK-FE"
  - owner: EDP-RSUD-Arifin-Achmad
    name: simdok-be
    label: "SIMDOK (Back-End)"
    category: "SIMDOK"
    project_key: "SIMDOK-BE"
  - owner: edprsudaa
    name: api-rme
    label: "TTE Gateway (api-rme)"
